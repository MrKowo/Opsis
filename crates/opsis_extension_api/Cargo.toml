[package]
name = "opsis_extension_api"
version = "0.1.0"
edition = "2021"
authors = ["Opsis Contributors"]
description = "Public API and traits for building Opsis runtime extensions"

[dependencies]
bytes = "1.10"
freya = { version = "0.4.1", default-features = false, features = ["winit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
