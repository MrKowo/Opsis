[package]
name = "opsis"
version = "0.1.0"
edition = "2021"
authors = ["Opsis Contributors"]
description = "A minimalist, hyper-fast image viewer"

[workspace]
members = [
    ".",
    "crates/opsis_extension_api",
]

[[bin]]
name = "opsis_0_1_0"
path = "src/main.rs"

[dependencies]
freya = { version = "0.4.1", default-features = false, features = ["winit", "engine"] }
opsis_extension_api = { path = "crates/opsis_extension_api" }
image = { version = "0.25", default-features = false, features = [
    "png", "jpeg", "webp", "bmp", "gif", "ico", "hdr", "tga", "tiff", "avif"
] }
rfd = "0.17"
bytes = "1.10"
libloading = "0.8"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

